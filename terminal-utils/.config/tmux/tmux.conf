# Set default terminal coloring
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',tmux-256color:RGB'

# --- Unbind and re-bind a new prifix in place of Ctrl-b ---
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix    # bind Ctrl-a as the new prefix


# --- Set up horizontal and vertical split of panes ---

# Unbind and re-bind split horizontally
unbind %
bind | split-window -h

# Unbind and re-bind split vertically
unbind '"'
bind - split-window -v


# --- Set up resize shortcuts for panes ---
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# shortcut to maximize a pane
bind -r m resize-pane -Z

# --- Enable mouse inside tmux ---
# Even though doing it with keyboard is good, the scrolling through terminal, resizing of pane is better with mouse.
set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse


# --- Set up navigating through TMUX via plugins
# Add tpm (tmux plugin manager) as a plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/gray' # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
# set -g @continuum-restore 'on' # enable tmux-continuum functionality


# --- Make it easier to REFRESH the TMUX Configuration ---
unbind r
bind r source-file ~/.config/tmux/tmux.conf


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# ==========================================================
# TMUX SHORTCUTS & PRODUCTIVITY CHEAT SHEET
# ==========================================================
#
# --- GLOBAL PREFIX ---
# Prefix        : Ctrl + a (Replaces standard Ctrl + b)
#
# --- SYSTEM & CONFIG ---
# Prefix + r    : Reload TMUX configuration (Custom)
# Prefix + d    : Detach from current session (leaves it running in background)
# Prefix + ?    : List all key bindings (Press 'q' to exit)
#
# --- WINDOWS (Like browser tabs) ---
# Prefix + c    : Create a new window
# Prefix + w    : List all windows (and sessions) to select from
# Prefix + n    : Move to next window
# Prefix + p    : Move to previous window
# Prefix + ,    : Rename the current window
# Prefix + &    : Kill (close) the current window
# Prefix + [0-9]: Jump directly to window number 0-9
#
# --- PANES (Splits within a window) ---
# Prefix + |    : Split pane horizontally (side-by-side) (Custom)
# Prefix + -    : Split pane vertically (top-and-bottom) (Custom)
# Prefix + x    : Kill (close) the current pane
# Prefix + q    : Briefly show pane numbers (type the number to jump to it)
# Prefix + Space: Cycle through default pane layouts
#
# --- PANE NAVIGATION (vim-tmux-navigator) ---
# Note: These do NOT require the Prefix key!
# Ctrl + h      : Move left (TMUX pane or Neovim split)
# Ctrl + j      : Move down (TMUX pane or Neovim split)
# Ctrl + k      : Move up (TMUX pane or Neovim split)
# Ctrl + l      : Move right (TMUX pane or Neovim split)
#
# --- PANE RESIZING (Custom) ---
# Prefix + h    : Resize pane left  (repeatable)
# Prefix + j    : Resize pane down  (repeatable)
# Prefix + k    : Resize pane up    (repeatable)
# Prefix + l    : Resize pane right (repeatable)
# Prefix + m    : Maximize/Minimize current pane (Zoom in/out)
#
# --- COPY MODE (Vi Keys) ---
# Prefix + [    : Enter Copy Mode
# v             : Start text selection
# y             : Yank (copy) selected text
# (Mouse drag)  : Highlights text (does not auto-exit copy mode when you let go)
# Prefix + ]    : Paste copied text
#
# --- SESSION MANAGEMENT (tmux-resurrect / continuum) ---
# Prefix + Ctrl-s : Save current TMUX session manually
# Prefix + Ctrl-r : Restore TMUX session manually
# (Continuum auto-saves in the background every 15 minutes)
#
# ==========================================================
