# Set default terminal coloring
set -g default-terminal "screen-256color"

# --- Unbind and re-bind a new prifix in place of Ctrl-b ---
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix    # bind Ctrl-a as the new prefix


# --- Set up horizontal and vertical split of panes ---

# Unbind and re-bind split horizontally
unbind %
bind | split-window -h

# Unbind and re-bind split vertically
unbind '"'
bind - split-window -v


# --- Set up resize shortcuts for panes ---
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# shortcut to maximize a pane
bind -r m resize-pane -Z

# --- Enable mouse inside tmux ---
# Even though doing it with keyboard is good, the scrolling through terminal, resizing of pane is better with mouse.
set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse


# --- Set up navigating through TMUX via plugins
# Add tpm (tmux plugin manager) as a plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/gray' # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality


# --- Make it easier to REFRESH the TMUX Configuration ---
unbind r
bind r source-file ~/.config/tmux/tmux.conf


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
